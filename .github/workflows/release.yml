name: Release

# Publishing is deliberately tag-driven, not push-driven: merging to main should
# not put a new version on the registry. `npm version patch|minor|major` then
# `git push --follow-tags` is the whole release ritual.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Declared whether or not npm requires it. If the trusted publisher is
    # configured with this environment the release fails without it; if it is
    # configured without one, an extra claim is simply ignored. Safe either way.
    environment: npm-publish
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm trusted publishing, so no NPM_TOKEN is needed
    steps:
      - uses: actions/checkout@v4
      # Deliberately no registry-url: setup-node would write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and with no token supplied that literal
      # placeholder shadows OIDC — npm then authenticates as nobody and the
      # publish fails with a misleading 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm; the one bundled with Node 22 is older.
      - run: npm install -g npm@latest

      # OIDC needs npm >= 11.5.1 and an ACTIONS_ID_TOKEN_REQUEST_URL in the
      # environment. Print both: an ENEEDAUTH with these present means the
      # trusted publisher is not configured on npmjs.com, which is invisible
      # from here otherwise.
      - name: Publishing preconditions
        run: |
          echo "npm  $(npm --version)"
          echo "node $(node --version)"
          echo "id-token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"

      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm publish --access public

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
